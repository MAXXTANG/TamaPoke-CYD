<script>
(() => {
 const root=document.getElementById('pika-pixel-proposal');
 const stage=root.querySelector('.pixel-screen');
 const canvas=stage.querySelector('canvas'),ctx=canvas.getContext('2d');
 const source=JSON.parse(document.getElementById('pika-pixel-assets').textContent);
 const world=document.createElement('canvas');world.width=80;world.height=60;
 const g=world.getContext('2d');g.imageSmoothingEnabled=false;ctx.imageSmoothingEnabled=false;
 const art={sprites:{},icons:{},thumbs:{}};
 const waiting=[];
 for(const group of ['sprites','icons'])for(const [key,value]of Object.entries(source[group])) {
  const image=new Image();art[group][key]=image;
  waiting.push(new Promise((resolve,reject)=>{image.onload=()=>{
   if(group==='icons'){const thumb=document.createElement('canvas');thumb.width=8;thumb.height=8;const c=thumb.getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(image,0,0,8,8);art.thumbs[key]=thumb;}
   resolve();};image.onerror=reject;}));image.src=value.src;
 }
 const state={action:'',sleeping:false,details:false,needs:true};
 let ready=false;
 function restore(snapshot) {
  const saved=snapshot?.privateContent?.pixel;
  if(!saved)return;
  for(const key of ['sleeping','details','needs'])if(typeof saved[key]==='boolean')state[key]=saved[key];
  if(['','food','play','sleep','clean','pet'].includes(saved.action))state.action=saved.action;
 }
 restore(window.openai?.widgetState);
 function save() {
  if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{proposal:'縮小皮卡丘與統一像素格',pixel:{...state}},privateContent:{pixel:{...state}}}).catch(()=>{});
 }
 function fill(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h);}
 function tile(x,y,w,h,color) {fill(x+1,y,w-2,h,color);fill(x,y+1,w,h-2,color);}
 function bitmap(rows,x,y,color) {g.fillStyle=color;rows.forEach((row,yy)=>[...row].forEach((bit,xx)=>{if(bit==='1')g.fillRect(x+xx,y+yy,1,1);}));}
 function text(s,x,y,scale=2,color='#fff3ce',shadow=true) {
  function write(px,py,ink){ctx.fillStyle=ink;for(let n=0;n<s.length;n++)for(let col=0;col<5;col++){const bits=source.font[s.charCodeAt(n)*5+col]||0;for(let row=0;row<8;row++)if(bits&(1<<row))ctx.fillRect(px+(n*6+col)*scale,py+row*scale,scale,scale);}}
  if(shadow)write(x+scale,y+scale,'#305a58');write(x,y,color);
 }
 function background(night) {
  const sky=night?['#253552','#304365','#3c5673','#466984']:['#a2d8ed','#a2d8ed','#b3e0ed','#c2e6e7'];
  for(let y=0;y<40;y++)fill(0,y,80,1,sky[Math.min(3,Math.floor(y/10))]);
  if(night){
   for(const [x,y]of [[8,13],[28,9],[40,15],[58,10],[74,23],[54,22]])fill(x,y,1,1,'#f6edc3');
   bitmap(['0011100','0111000','1110000','1110000','1110000','0111000','0011100'],65,13,'#f4e7ad');
  }else{
   bitmap(['00111100','01111110','11111111','11111111','11111111','11111111','01111110','00111100'],65,12,'#f5e59e');
   bitmap(['0001100000','0011110000','0111111100','1111111111','0111111110'],8,15,'#f2f7dd');
   bitmap(['00110000','01111000','11111111','01111110'],51,23,'#f2f7dd');
  }
  for(let x=0;x<80;x++){
   const y=33-Math.max(0,7-Math.abs(x-15)/2,4-Math.abs(x-53)/3,5-Math.abs(x-72)/2);
   fill(x,Math.round(y),1,60-Math.round(y),night?'#3d655d':'#90c59c');
  }
  for(let x=0;x<80;x++){
   const y=38+Math.round(Math.sin(x/11)*1.4);
   fill(x,y,1,60-y,night?'#305444':'#82b77b');
   fill(x,y+2,1,60-y-2,night?'#355c49':'#91c57f');
  }
  fill(5,31,2,8,night?'#3e5944':'#857656');
  tile(2,28,8,7,night?'#426b4e':'#71a675');
  tile(3,25,6,5,night?'#4c7755':'#82b980');
  fill(6,28,2,1,night?'#5a8463':'#a1cd92');
  for(const [x,y]of [[3,43],[16,40],[67,41],[74,46],[26,48],[57,48],[45,57],[7,56],[70,55]]){
   fill(x,y,1,2,night?'#244836':'#71a56b');fill(x-1,y+1,3,1,night?'#244836':'#71a56b');
  }
  if(!night)for(const [x,y]of [[12,42],[65,39],[21,45],[75,40]]){
   fill(x-1,y,3,1,'#f5e7b6');fill(x,y-1,1,3,'#f5e7b6');fill(x,y,1,1,'#d3b36b');
  }
 }
 function render() {
  if(!ready)return;
  background(state.sleeping);
  const pose=state.sleeping?'sleep':state.action==='food'?'eat':state.action==='play'?'hop':state.action==='clean'?'sit':state.action==='pet'?'pose':'idle';
  const image=art.sprites[pose],data=source.sprites[pose];
  // Every world pixel, character pixel and large icon pixel is the same 4x4 LCD cell.
  for(let y=0;y<3;y++)fill(40-(10-y*2),42+y,20-y*4,1,state.sleeping?'#264938':'#64965d');
  g.drawImage(image,Math.floor((80-data.width)/2),43-data.height,data.width,data.height);
  if(state.action==='food'&&!state.sleeping)g.drawImage(art.icons.food,53,27,16,16);
  if(state.action==='play'&&!state.sleeping)g.drawImage(art.icons.play,53,27,16,16);
  if(state.action==='pet'&&!state.sleeping)bitmap(['11011','11111','11111','01110','00100'],54,23,'#cf7378');
  if(state.action==='clean'&&!state.sleeping)for(const [x,y]of [[26,26],[52,30],[24,36]]){
   bitmap(['0110','1111','1111','0110'],x,y,'#d9eddf');fill(x+1,y+1,1,1,'#f6f7d9');
  }
  const keys=['food','play','sleep','clean'];
  keys.forEach((key,i)=>{
   const x=2+i*20,y=44,pressed=state.action===key;
   tile(x,y+1,16,14,state.sleeping?'#253f33':'#4f7e4d');
   tile(x,y,16,14,pressed?'#d7bf83':'#b49c69');
   tile(x,y,16,13,pressed?'#efd28b':'#f3e7b6');
   fill(x+2,y+1,12,1,pressed?'#f5df9c':'#fff3d4');
   g.drawImage(art.icons[key],x,y-1,16,16);
  });
  tile(70,2,8,8,'#5c8f85');fill(71,3,6,6,'#7eada0');
  ctx.clearRect(0,0,320,240);ctx.drawImage(world,0,0,320,240);
  text('PIKACHU',8,8,2);text('Lv.1',8,28,2);text('i',290,14,2,'#fff3d2',false);
  const values={food:state.action==='food'?100:80,play:['play','pet'].includes(state.action)?90:80,sleep:state.sleeping?95:80,clean:100};
  if(state.needs)keys.forEach((key,i)=>{
   const x=116+i*36;ctx.drawImage(art.thumbs[key],x,8,32,32);
   ctx.fillStyle='#619b91';ctx.fillRect(x,44,32,4);
   ctx.fillStyle='#f7e5a3';ctx.fillRect(x,44,Math.round(values[key]*8/100)*4,4);
  });
  if(state.action){const words={food:'YUM!',play:'PLAY!',sleep:'ZZZ...',clean:'FRESH!',pet:'LOVE!'};text(words[state.action],224,96,2,'#fff3d0');}
  if(state.details){
   ctx.fillStyle='#527e69';ctx.fillRect(64,46,192,128);ctx.fillStyle='#eee2b0';ctx.fillRect(64,42,192,128);
   text('STATUS',76,50,2,'#365b45',false);
   keys.forEach((key,i)=>{const y=74+i*20;const label={food:'FOOD',play:'JOY',sleep:'ENERGY',clean:'CLEAN'}[key];
    text(label,76,y,2,'#365b45',false);ctx.fillStyle='#c8c297';ctx.fillRect(154,y+4,56,8);ctx.fillStyle='#79a976';ctx.fillRect(154,y+4,Math.round(values[key]*56/200)*2,8);text(String(values[key]),218,y,2,'#365b45',false);
   });
  }
  stage.dataset.action=state.action;stage.dataset.pose=pose;stage.dataset.sleeping=String(state.sleeping);
  root.querySelectorAll('.pixel-action[data-action]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.action===state.action)));
  root.querySelector('.pixel-info').setAttribute('aria-expanded',String(state.details));
  root.querySelector('.pixel-action[data-action="sleep"]').setAttribute('aria-label',state.sleeping?'喚醒':'睡覺');
  const labels={food:'餵食預覽',play:'玩耍預覽',sleep:'皮卡丘睡覺了',clean:'洗澡預覽',pet:'摸摸皮卡丘'};
  root.querySelector('.pixel-announcement').textContent=labels[state.action]||'';
  root.dataset.ready='true';
 }
 root.querySelectorAll('.pixel-action[data-action]').forEach(button=>button.addEventListener('click',()=>{
  const action=button.dataset.action;state.details=false;
  if(action==='sleep'){state.sleeping=!state.sleeping;state.action=state.sleeping?'sleep':'';}
  else {state.sleeping=false;state.action=state.action===action?'':action;}
  render();save();
 }));
 root.querySelector('.pixel-pet').addEventListener('click',()=>{state.sleeping=false;state.details=false;state.action=state.action==='pet'?'':'pet';render();save();});
 root.querySelector('.pixel-info').addEventListener('click',()=>{state.details=!state.details;render();save();});
 if(globalThis.Tweak){const tweak=new Tweak({container:stage,onChange:()=>{render();save();}});tweak.addToggle(state,'needs',{label:'顯示上方需求圖示'});}
 window.addEventListener('openai:set_globals',event=>{restore(event.detail?.globals?.widgetState);render();});
 Promise.all(waiting).then(()=>{ready=true;render();}).catch(()=>{root.dataset.error='assets';});
})();
</script>
