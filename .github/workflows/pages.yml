name: Publish CYD installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 tools/check_cyd.py
      - run: python3 tools/check_web.py
      - run: node --test test/web-*.test.mjs
      - uses: actions/configure-pages@v5
      - id: artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: deployment
        name: Deploy the verified Pages artifact through the official API
        uses: actions/github-script@v7
        env:
          CYD_PAGES_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        with:
          script: |
            const deploy = require('./tools/deploy_pages.cjs');
            await deploy({ github, context, core, artifactId: Number(process.env.CYD_PAGES_ARTIFACT_ID) });
